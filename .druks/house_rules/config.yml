exclude: [uv.lock, frontend/package-lock.json, backend/druks/migrations/versions/**]

R21:
  modules: [fastapi, sqlalchemy, sqlalchemy.orm, pydantic, dbos]

R16:
  root: backend
  package: druks
  author_surface: [druks.workflows, druks.workspaces, druks.agents, druks.events, druks.signals, druks.db, druks.schemas, druks.prompts, druks.durable, druks.apps, druks.ui, druks.webhooks]
  public: [druks.workflows, druks.workspaces, druks.agents, druks.events, druks.signals, druks.db, druks.schemas, druks.prompts, druks.durable, druks.apps, druks.ui, druks.webhooks, druks.core, druks.chat]
  apps: [druks.contrib]
  # software_factory reads these platform internals today.
  ignore_imports:
    - druks.contrib.** -> druks.accounts.context
    - druks.contrib.** -> druks.accounts.dependencies
    - druks.contrib.** -> druks.accounts.models
    - druks.contrib.** -> druks.api.exceptions
    - druks.contrib.** -> druks.doctor
    - druks.contrib.** -> druks.exceptions
    - druks.contrib.** -> druks.mcp.inbound
    - druks.contrib.** -> druks.models
    - druks.contrib.** -> druks.sandbox
    - druks.contrib.** -> druks.sandbox.datastructures
    - druks.contrib.** -> druks.sandbox.host
    - druks.contrib.** -> druks.sandbox.layout
    - druks.contrib.** -> druks.services
    - druks.contrib.** -> druks.services.exceptions
    - druks.contrib.** -> druks.settings
    - druks.contrib.** -> druks.skills.models

