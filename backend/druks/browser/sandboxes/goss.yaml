# The boot contract of the browser template: the drukbox base entrypoint seeds
# the ``druks`` user that browser.sh adds, and /work/session belongs to it.
# dgoss checks it in CI with DRUKBOX_SSH_USER=druks and
# DRUKBOX_AUTHORIZED_KEY="ssh-ed25519 AAAA goss".
file:
  /home/druks/.ssh/authorized_keys:
    exists: true
    mode: "0600"
    owner: druks
    group: druks
    contents:
      - ssh-ed25519 AAAA goss
  /work/session:
    exists: true
    filetype: directory
    mode: "0700"
    owner: druks
process:
  sshd:
    running: true
port:
  tcp:22:
    listening: true
