<html>
<body>
<form method="post" action="https://github.com/settings/apps/new">
  <input type="hidden" name="manifest" value="{{ manifest_json }}">
  <p>Continue to GitHub to create the App druks acts as. GitHub creates it on
    your personal account unless you name an organization to own it.</p>
  <p><label>Owning organization (optional) <input name="org"></label></p>
  <p><button type="submit">Continue to GitHub</button></p>
</form>
<script>
  document.forms[0].onsubmit = function () {
    var org = this.elements.org.value.trim();
    if (org) this.action = 'https://github.com/organizations/' + encodeURIComponent(org) + '/settings/apps/new';
    this.elements.org.disabled = true;
  };
</script>
</body>
</html>
