# The Druks stack: web, Postgres, Redis, and the drukbox sandbox control plane.
# This one file applies to all install shapes. install.sh writes COMPOSE_PROFILES
# to .env. The "hosted" profile starts the Caddy edge and the janitor. The
# docker-sbx provider adds one overlay file, because its drukbox has different
# mounts. All services use the host network. Services connect to Postgres and
# Redis on 127.0.0.1. drukbox connects to each sandbox at the address the
# provider returns.

x-druks: &druks
  image: ghcr.io/czpython/druks:${DRUKS_TAG:-latest}
  # Run as the deploy user (who owns the mounted ~/.claude, ~/.codex, and data
  # dir), not root, so everything written under the data mount stays owned by
  # (and writable to) the deploy user. install.sh writes DRUKS_UID/DRUKS_GID
  # into .env from `id -u` / `id -g`.
  user: "${DRUKS_UID:?set DRUKS_UID in .env — run install.sh}:${DRUKS_GID:?set DRUKS_GID in .env — run install.sh}"
  restart: unless-stopped
  network_mode: host
  env_file:
    - ./.env
  environment:
    DRUKS_CONFIG: /app/druks.toml
    DRUKS_REDIS_URL: ${DRUKS_REDIS_URL:-redis://127.0.0.1:6379/0}
    DRUKS_DATABASE_URL: ${DRUKS_DATABASE_URL:-postgresql+psycopg://${DRUKS_POSTGRES_USER:-druks}:${DRUKS_POSTGRES_PASSWORD}@127.0.0.1:5432/${DRUKS_POSTGRES_DB:-druks}}
    DRUKS_DATA_DIR: /app/data
    # Container view of the CLI config mounts below. Subscription credentials
    # live in the DB (dashboard connect flow) — these carry config only.
    DRUKS_CLAUDE_CONFIG_DIR: /harnesses/claude
    DRUKS_CODEX_CONFIG_DIR: /harnesses/codex
    # Operator-installed skills live in the (writable) data volume — the
    # settings UI installs collections here and druks pushes them into every
    # VM at both ~/.claude/skills and ~/.codex/skills.
    DRUKS_SKILLS_DIR: /app/data/skills
    DRUKS_SANDBOX_KEYS_DIR: /app/sandbox-keys
  volumes:
    - ./druks.toml:/app/druks.toml:ro
    - ${DRUKS_DATA_HOST_DIR:-${DRUKS_DATA_DIR:-${HOME}/druks-data}}:/app/data
    # claude/codex config dirs (settings.json/plugins, config.toml/AGENTS.md),
    # carried into each sandbox at push time. Auth never reads them — tokens
    # live in the DB and rotate there — so the mounts are read-only.
    - ${DRUKS_CLAUDE_HOME:-${HOME}/.claude}:/harnesses/claude:ro
    - ${DRUKS_CODEX_HOME:-${HOME}/.codex}:/harnesses/codex:ro
    - ${DRUKS_CLAUDE_JSON:-${HOME}/.claude.json}:/harnesses/.claude.json:ro
    # Shared so a reattaching worker reads the key the acquirer wrote.
    - druks_sandbox_keys:/app/sandbox-keys
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

# The sandbox control plane. Every install has it. Only its provider
# configuration changes between shapes. That configuration comes from .env:
# DEFAULT_HOST_PROVIDER and the [sandbox.<provider>] values that druks setup
# renders.
x-drukbox: &drukbox
  image: ${DRUKS_SANDBOX_SERVICE_IMAGE:-ghcr.io/czpython/drukbox:latest}
  restart: unless-stopped
  network_mode: host
  # The docker provider uses the mounted socket: for sandboxes on the local
  # shape, and for browser-login containers on every shape. install.sh records
  # the gid of the socket, then the non-root appuser can use it. On macOS the
  # mounted socket has group root, and install.sh writes 0.
  group_add:
    - "${DRUKS_DOCKER_GID:-0}"
  env_file:
    - ./.env
  environment:
    DATABASE_URL: postgresql+psycopg://${DRUKS_POSTGRES_USER:-druks}:${DRUKS_POSTGRES_PASSWORD}@127.0.0.1:5432/drukbox
    # Only web calls drukbox. The call stays on loopback, also on Docker
    # Desktop, where the services share the VM host network. Use the override
    # variable only for a future multi-host split. SERVICE_TOKENS has no
    # default here on purpose. The value comes from .env. Without a value,
    # drukbox does not start. A known default token is not safe.
    UVICORN_HOST: ${DRUKS_DRUKBOX_BIND_HOST:-127.0.0.1}
    # Off, unless the [sandbox.<provider>] table sets TAILSCALE_ENABLED=true
    # (the exe provider does).
    TAILSCALE_ENABLED: ${TAILSCALE_ENABLED:-false}
    # Browser-login containers run sshd for the druks user, not for root.
    DOCKER_SSH_USERNAME: druks
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy

services:
  web:
    <<: *druks
    # DBOS runs embedded here: this one process serves HTTP and executes durable
    # workflows + schedules (concurrency is bounded by the DBOS queue, not the
    # process count — host networking pins it to one port). A redeploy interrupts
    # in-flight workflows, which recover durably. If execution outgrows one
    # process, add a port-free worker tier of DBOS executors.
    #
    # Schema is applied out of band, not on boot: install.sh runs
    # ``docker compose run --rm web druks init-db`` on install and upgrade.
    command:
      [
        "uvicorn",
        "druks.api.server:app",
        "--host",
        "${DRUKS_WEB_BIND_HOST:-127.0.0.1}",
        "--port",
        "8001",
      ]

  drukbox:
    <<: *drukbox

  # The periodic janitor. drukbox has no scheduler, and this loop with sleep
  # does the work. A real timer belongs in the drukbox service or image, not
  # in compose. Only hosted installs run it. A local box reaps on the next
  # request.
  drukbox-janitor:
    <<: *drukbox
    profiles: ["hosted"]
    entrypoint:
      - sh
      - -c
      - "while true; do .venv/bin/python -m hosts.janitor || true; sleep 60; done"
    # The image HEALTHCHECK probes the HTTP API. On the host network, the
    # janitor would probe the port of the drukbox service. That doubles the
    # /healthz traffic and reports a status that is not its own.
    healthcheck:
      disable: true

  # The SSH path into gateway-provider sandboxes. These sandboxes have no
  # reachable sshd. druks connects to the gateway, and the gateway opens an
  # exec session. That wakes a stopped sandbox. The service does nothing
  # without the docker-sbx overlay, which adds the sbx mounts. install.sh
  # enables the profile only for that provider.
  drukbox-gateway:
    <<: *drukbox
    profiles: ["gateway"]
    entrypoint: [".venv/bin/python", "-m", "gateway.server"]
    # The image HEALTHCHECK probes the drukbox HTTP API. This service is not
    # that API.
    healthcheck:
      disable: true

  # The identity edge and webhook TLS. Only hosted installs run it. A local
  # box gets the dashboard directly on 127.0.0.1:8001. Stock image with no
  # baked configuration. install.sh fetches the Caddyfile next to this file.
  caddy:
    profiles: ["hosted"]
    image: caddy:2.10-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      DRUKS_UPSTREAM: ${DRUKS_UPSTREAM:-127.0.0.1:8001}
      # Setup renders identity.header for Caddy. druks reads it from
      # druks.toml. Caddy requires the assertion from the edge, and druks maps
      # it to an account. There is no default. The backend refuses header mode
      # without it.
      DRUKS_AUTH_HEADER: ${DRUKS_AUTH_HEADER:-}
      # ``:-`` makes an empty .env value collapse to the inert loopback
      # default. Caddy reads a set-but-empty value as a real, broken site
      # address.
      DRUKS_WEBHOOK_HOST: ${DRUKS_WEBHOOK_HOST:-http://127.0.0.1:8081}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${DRUKS_POSTGRES_USER:-druks}
      POSTGRES_PASSWORD: ${DRUKS_POSTGRES_PASSWORD:?set DRUKS_POSTGRES_PASSWORD in .env — druks setup generates one}
      POSTGRES_DB: ${DRUKS_POSTGRES_DB:-druks}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DRUKS_POSTGRES_USER:-druks}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  druks_sandbox_keys:
  caddy_data:
  caddy_config:
