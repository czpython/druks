# Druks stack: web, Postgres, Redis, and the sandbox control plane (drukbox).
# One file for every install shape — install.sh writes COMPOSE_PROFILES in .env
# to turn on the hosted extras (Caddy identity edge, the janitor), and a provider
# whose drukbox needs a different shape (docker-sbx) layers a thin overlay.
# Host networking throughout: services reach Postgres and Redis on 127.0.0.1, and
# drukbox reaches each sandbox's sshd at the address its provider returns — a
# host-loopback port locally, a provider-reachable address remotely.

x-druks: &druks
  image: ghcr.io/czpython/druks:${DRUKS_TAG:-latest}
  # Run as the deploy user (who owns the mounted ~/.claude, ~/.codex, and data
  # dir), not root, so everything written under the data mount stays owned by
  # (and writable to) the deploy user. install.sh writes DRUKS_UID/DRUKS_GID
  # into .env from `id -u` / `id -g`.
  user: "${DRUKS_UID:?set DRUKS_UID in .env — run install.sh}:${DRUKS_GID:?set DRUKS_GID in .env — run install.sh}"
  restart: unless-stopped
  network_mode: host
  env_file:
    - ./.env
  environment:
    DRUKS_CONFIG: /app/druks.toml
    DRUKS_REDIS_URL: ${DRUKS_REDIS_URL:-redis://127.0.0.1:6379/0}
    DRUKS_DATABASE_URL: ${DRUKS_DATABASE_URL:-postgresql+psycopg://${DRUKS_POSTGRES_USER:-druks}:${DRUKS_POSTGRES_PASSWORD}@127.0.0.1:5432/${DRUKS_POSTGRES_DB:-druks}}
    DRUKS_DATA_DIR: /app/data
    # Container view of the CLI config mounts below. Subscription credentials
    # live in the DB (dashboard connect flow) — these carry config only.
    DRUKS_CLAUDE_CONFIG_DIR: /harnesses/claude
    DRUKS_CODEX_CONFIG_DIR: /harnesses/codex
    # Operator-installed skills live in the (writable) data volume — the
    # settings UI installs collections here and druks pushes them into every
    # VM at both ~/.claude/skills and ~/.codex/skills.
    DRUKS_SKILLS_DIR: /app/data/skills
    DRUKS_SANDBOX_KEYS_DIR: /app/sandbox-keys
  volumes:
    - ./druks.toml:/app/druks.toml:ro
    - ${DRUKS_DATA_HOST_DIR:-${DRUKS_DATA_DIR:-${HOME}/druks-data}}:/app/data
    # claude/codex config dirs (settings.json/plugins, config.toml/AGENTS.md),
    # carried into each sandbox at push time. Auth never reads them — tokens
    # live in the DB and rotate there — so the mounts are read-only.
    - ${DRUKS_CLAUDE_HOME:-${HOME}/.claude}:/harnesses/claude:ro
    - ${DRUKS_CODEX_HOME:-${HOME}/.codex}:/harnesses/codex:ro
    - ${DRUKS_CLAUDE_JSON:-${HOME}/.claude.json}:/harnesses/.claude.json:ro
    # Shared so a reattaching worker reads the key the acquirer wrote.
    - druks_sandbox_keys:/app/sandbox-keys
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

# The sandbox control plane. Present in every install; only its provider-facing
# configuration varies, and that rides in .env (DEFAULT_HOST_PROVIDER and the
# [sandbox.<provider>] passthrough that druks setup renders).
x-drukbox: &drukbox
  image: ${DRUKS_SANDBOX_SERVICE_IMAGE:-ghcr.io/czpython/drukbox:latest}
  restart: unless-stopped
  network_mode: host
  # The mounted socket serves the docker provider (sandboxes locally, browser-
  # login containers on every provider). install.sh records the socket's gid so
  # drukbox's non-root appuser may use it — on macOS the mounted socket is group
  # root, so setup writes 0.
  group_add:
    - "${DRUKS_DOCKER_GID:-0}"
  env_file:
    - ./.env
  environment:
    DATABASE_URL: postgresql+psycopg://${DRUKS_POSTGRES_USER:-druks}:${DRUKS_POSTGRES_PASSWORD}@127.0.0.1:5432/drukbox
    # Bind loopback on a real host, 0.0.0.0 only where Docker Desktop needs it —
    # the same per-OS value web uses. Only web calls drukbox, over loopback.
    UVICORN_HOST: ${DRUKS_WEB_BIND_HOST:-0.0.0.0}
    # Off unless a provider turns it on via its [sandbox.<provider>] passthrough
    # (exe sets TAILSCALE_ENABLED=true).
    TAILSCALE_ENABLED: ${TAILSCALE_ENABLED:-false}
    # Browser-login containers run sshd for the druks user, not root.
    DOCKER_SSH_USERNAME: druks
    # The token web presents: dev-token on a local box, the generated one on a
    # hosted box (druks setup writes it to .env for every non-docker provider).
    SERVICE_TOKENS: ${SERVICE_TOKENS:-dev-token}
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  depends_on:
    postgres:
      condition: service_healthy

services:
  web:
    <<: *druks
    # DBOS runs embedded here: this one process serves HTTP and executes durable
    # workflows + schedules (concurrency is bounded by the DBOS queue, not the
    # process count — host networking pins it to one port). A redeploy interrupts
    # in-flight workflows, which recover durably. If execution outgrows one
    # process, add a port-free worker tier of DBOS executors.
    #
    # Schema is applied out of band, not on boot: install.sh runs
    # ``docker compose run --rm web druks init-db`` on install and upgrade.
    command:
      [
        "uvicorn",
        "druks.api.app:app",
        "--host",
        "${DRUKS_WEB_BIND_HOST:-127.0.0.1}",
        "--port",
        "8001",
      ]

  drukbox:
    <<: *drukbox

  # Periodic janitor — drukbox ships no scheduler, so loop with sleep; a real
  # timer belongs in the drukbox service/image, not in compose. Hosted installs
  # only (COMPOSE_PROFILES=...,janitor); a local box reaps on the next request.
  drukbox-janitor:
    <<: *drukbox
    profiles: ["janitor"]
    entrypoint:
      - sh
      - -c
      - "while true; do .venv/bin/python -m hosts.janitor || true; sleep 60; done"
    # The image HEALTHCHECK probes the HTTP API — on host networking the janitor
    # would health-check the *service's* port, doubling /healthz traffic and
    # reporting a status that isn't its own.
    healthcheck:
      disable: true

  # The identity edge + webhook TLS. Hosted installs only
  # (COMPOSE_PROFILES=caddy); a local box reaches the dashboard directly on
  # 127.0.0.1:8001. Stock image, no baked config — install.sh fetches the
  # Caddyfile next to this file.
  caddy:
    profiles: ["caddy"]
    image: caddy:2.10-alpine
    network_mode: host
    restart: unless-stopped
    environment:
      DRUKS_UPSTREAM: ${DRUKS_UPSTREAM:-127.0.0.1:8001}
      # Setup renders identity.header for Caddy; druks reads it from druks.toml.
      # Caddy requires the edge's assertion, and druks maps it to an account.
      # No default anywhere — the backend refuses header mode without it.
      DRUKS_AUTH_HEADER: ${DRUKS_AUTH_HEADER:-}
      # ``:-`` so an empty .env value still collapses to the inert loopback
      # default — Caddy treats set-but-empty as a real (broken) site address.
      DRUKS_WEBHOOK_HOST: ${DRUKS_WEBHOOK_HOST:-http://127.0.0.1:8081}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${DRUKS_POSTGRES_USER:-druks}
      POSTGRES_PASSWORD: ${DRUKS_POSTGRES_PASSWORD:?set DRUKS_POSTGRES_PASSWORD in .env — druks setup generates one}
      POSTGRES_DB: ${DRUKS_POSTGRES_DB:-druks}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DRUKS_POSTGRES_USER:-druks}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
  druks_sandbox_keys:
  caddy_data:
  caddy_config:
