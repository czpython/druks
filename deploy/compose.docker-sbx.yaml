# Docker Sandboxes overlay. Reshapes the drukbox services to drive the host's
# per-user sandboxd (microVM sandboxes) and adds the SSH gateway that fronts
# them. install.sh layers this file and turns on COMPOSE_PROFILES=...,gateway
# when the provider is docker-sbx.
#
# The rig is what a container needs to reach a per-user daemon: its socket, the
# host's sbx CLI (mounting it keeps CLI and daemon versions agreeing), the CLI
# auth store, and the workspace root — the last three at a path identical inside
# and out, because the daemon resolves paths on its own filesystem. The services
# run as the daemon owner's uid (the deploy user); DRUKS_SBX_HOME is that user's
# home, defaulting to it. The base drukbox's docker.sock mount rides along
# (browser-login containers still use the docker provider).

x-sbx-rig: &sbx-rig
  user: "${DRUKS_UID:?set DRUKS_UID in .env — run install.sh}:${DRUKS_GID:?set DRUKS_GID in .env — run install.sh}"
  volumes:
    - ${DRUKS_SBX_HOME:-${HOME}}/.local/state/sandboxes/sandboxes/sandboxd/sandboxd.sock:/run/sandboxd.sock
    - /usr/bin/sbx:/usr/local/bin/sbx:ro
    - ${DRUKS_SBX_HOME:-${HOME}}/.config/com.docker.sandboxes:${DRUKS_SBX_HOME:-${HOME}}/.config/com.docker.sandboxes:ro
    - ${DRUKS_SBX_HOME:-${HOME}}/.drukbox:${DRUKS_SBX_HOME:-${HOME}}/.drukbox

# The image has no user at the deploy uid, so home-derived defaults resolve
# nowhere. XDG_CONFIG_HOME points the sbx CLI at the mounted auth store; the
# workspace root is pinned so it can never disagree with the mount above.
x-sbx-env: &sbx-env
  XDG_CONFIG_HOME: ${DRUKS_SBX_HOME:-${HOME}}/.config
  DOCKER_SANDBOXES_API: unix:///run/sandboxd.sock
  DOCKER_SBX_WORKSPACE_ROOT: ${DRUKS_SBX_HOME:-${HOME}}/.drukbox/sbx-workspaces

services:
  drukbox:
    <<: *sbx-rig
    environment:
      <<: *sbx-env

  drukbox-janitor:
    <<: *sbx-rig
    environment:
      <<: *sbx-env

  # The SSH path to sandboxes: microVMs have no dialable sshd, so druks connects
  # here and the gateway opens an sbx exec session, waking stopped sandboxes.
  # GATEWAY_SSH_HOST — the address the provider advertises to callers — rides in
  # .env via the [sandbox.docker-sbx] passthrough; provisioning refuses without
  # it. New service, so it inherits nothing from the base drukbox anchor.
  drukbox-gateway:
    <<: *sbx-rig
    image: ${DRUKS_SANDBOX_SERVICE_IMAGE:-ghcr.io/czpython/drukbox:latest}
    network_mode: host
    restart: unless-stopped
    profiles: ["gateway"]
    entrypoint: [".venv/bin/python", "-m", "gateway.server"]
    env_file:
      - ./.env
    environment:
      <<: *sbx-env
      GATEWAY_HOST_KEY_PATH: ${DRUKS_SBX_HOME:-${HOME}}/.drukbox/gateway_host_key
    depends_on:
      postgres:
        condition: service_healthy
    # The image HEALTHCHECK probes the drukbox HTTP API, which this is not.
    healthcheck:
      disable: true
