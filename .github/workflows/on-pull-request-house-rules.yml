name: On Pull Request House Rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, "codex/**"]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Branch protection requires the "druks-house-rules / check" check; this job name is its first half.
  druks-house-rules:
    uses: getdruks/druks-workflows/.github/workflows/house-rules.yml@v1
    with:
      # The release whose R28 passes a person's co-author line.
      ref: v0.0.3
