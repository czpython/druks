name: On Pull Request Frontend

# No path filter: branch protection requires this job. A workflow that filters
# itself out reports no context, and the pull request can never merge.
on:
  pull_request:
    branches: [main]

concurrency:
  group: on-pull-request-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
